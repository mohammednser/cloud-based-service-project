version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd cloud-based-service
        - nvm install 20.16.0
        - nvm use 20.16.0
        - npm ci
    build:
      commands:
        - cd cloud-based-service
        - npm run build
  artifacts:
    baseDirectory: cloud-based-service/build
    files:
      - '**/*'
  cache:
    paths:
      - cloud-based-service/node_modules/**/*